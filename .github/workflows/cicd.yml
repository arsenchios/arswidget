name: Build for macOS

on:
  # '*' does not match a '/', so pushes to branches like claude/... or
  # feature/... were never built — every run so far came from main.
  # '**' matches nested branch names too.
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Проверка сборки ArsWidget
    strategy:
      matrix:
        platform:
          - macOS
        scheme:
          - ArsWidget
    runs-on: macos-latest
    steps:
    - name: Code Checkout
      # TODO: pin to immutable SHA
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: |
        xcodebuild \
          -project ArsWidget.xcodeproj \
          -scheme ${{ matrix.scheme }} \
          -configuration Release \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
          build
    - name: Verify distribution signatures
      run: |
        ./Configuration/release-sign.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/ArsWidget.app"
        lipo -archs "$RUNNER_TEMP/DerivedData/Build/Products/Release/ArsWidget.app/Contents/MacOS/ArsWidget"
        lipo -archs "$RUNNER_TEMP/DerivedData/Build/Products/Release/ArsWidget.app/Contents/MacOS/ArsWidgetClipboardReader"
