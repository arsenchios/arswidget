name: Выпуск обновления ArsWidget

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия в формате 0.1.0"
        required: true
        type: string
      notes:
        description: "Кратко: что изменилось"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      APP_NAME: ArsWidget
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Получить код
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Обновить номер версии для выпуска
        run: |
          SOURCE_BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9]*\);/\1/p' ArsWidget.xcodeproj/project.pbxproj | sort -nr | head -1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          BUILD_NUMBER=$((BUILD_NUMBER + 1000))
          if [ "$BUILD_NUMBER" -le "$SOURCE_BUILD" ]; then BUILD_NUMBER=$((SOURCE_BUILD + 1)); fi
          export BUILD_NUMBER
          perl -0pi -e 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $ENV{VERSION};/g' ArsWidget.xcodeproj/project.pbxproj
          perl -0pi -e 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g' ArsWidget.xcodeproj/project.pbxproj
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Собрать приложение
        run: |
          xcodebuild \
            -project ArsWidget.xcodeproj \
            -scheme ArsWidget \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build

      - name: Переподписать встроенные компоненты
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          test -d "$APP_PATH"
          ./Configuration/release-sign.sh "$APP_PATH"

      - name: Установить инструмент для DMG
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install --require-hashes -r Configuration/dmg/requirements.txt
          echo "$RUNNER_TEMP/dmg-venv/bin" >> "$GITHUB_PATH"

      - name: Подготовить архив
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          UPDATES_DIR="$RUNNER_TEMP/updates"
          PACKAGE_DIR="$UPDATES_DIR/$APP_NAME-$VERSION"
          mkdir -p "$UPDATES_DIR"
          test -d "$APP_PATH"
          mkdir -p "$PACKAGE_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/$APP_NAME.app"
          cp "ИНСТРУКЦИЯ ПО УСТАНОВКЕ.txt" "$PACKAGE_DIR/ИНСТРУКЦИЯ ПО УСТАНОВКЕ.txt"
          ditto -c -k --keepParent "$PACKAGE_DIR" "$UPDATES_DIR/$APP_NAME-$VERSION.zip"
          ./Configuration/dmg/create_dmg.sh "$APP_PATH" "$UPDATES_DIR/$APP_NAME-$VERSION.dmg" "$APP_NAME"
          EXTENSION_VERSION=$(python3 -c 'import json; print(json.load(open("chrome-extension/arswidget-ai-limits/manifest.json"))["version"])')
          ditto -c -k --keepParent chrome-extension/arswidget-ai-limits "$UPDATES_DIR/ArsWidget-AI-Limits-$EXTENSION_VERSION.zip"
          printf '%s\n' "$NOTES" > "$UPDATES_DIR/$APP_NAME-$VERSION.md"
          (cd "$UPDATES_DIR" && shasum -a 256 "$APP_NAME-$VERSION.zip" "$APP_NAME-$VERSION.dmg" ArsWidget-AI-Limits-*.zip > SHA256SUMS.txt)

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/updates/$APP_NAME-$VERSION.zip" \
            "$RUNNER_TEMP/updates/$APP_NAME-$VERSION.dmg" \
            "$RUNNER_TEMP/updates/SHA256SUMS.txt" \
            "$RUNNER_TEMP/updates/"ArsWidget-AI-Limits-*.zip \
            --title "ArsWidget $VERSION" \
            --notes-file "$RUNNER_TEMP/updates/$APP_NAME-$VERSION.md"

      - name: Сохранить номер версии
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArsWidget.xcodeproj/project.pbxproj
          git diff --cached --quiet || git commit -m "Release ArsWidget $VERSION"
          git pull --rebase origin main
          git push origin main
