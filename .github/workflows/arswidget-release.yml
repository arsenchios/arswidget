name: Выпуск обновления ArsWidget

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия в формате 0.1.0"
        required: true
        type: string
      notes:
        description: "Кратко: что изменилось"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      APP_NAME: ArsWidget
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      NOTES: ${{ inputs.notes }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.ARSWIDGET_SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Получить код
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Обновить номер версии для выпуска
        run: |
          BUILD_NUMBER=$((BUILD_NUMBER + 1000))
          export BUILD_NUMBER
          perl -0pi -e 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $ENV{VERSION};/g' ArsWidget.xcodeproj/project.pbxproj
          perl -0pi -e 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g' ArsWidget.xcodeproj/project.pbxproj
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Собрать приложение
        run: |
          xcodebuild \
            -project ArsWidget.xcodeproj \
            -scheme ArsWidget \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Подготовить архив
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          UPDATES_DIR="$RUNNER_TEMP/updates"
          mkdir -p "$UPDATES_DIR"
          test -d "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$UPDATES_DIR/$APP_NAME-$VERSION.zip"
          printf '%s\n' "$NOTES" > "$UPDATES_DIR/$APP_NAME-$VERSION.md"
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            GENERATOR=$(find "$RUNNER_TEMP/DerivedData/SourcePackages" -type f -name generate_appcast -perm -111 | head -n 1)
            test -n "$GENERATOR"
            printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATOR" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --embed-release-notes \
              -o "$UPDATES_DIR/appcast.xml" \
              "$UPDATES_DIR"
            cp "$UPDATES_DIR/appcast.xml" updater/appcast.xml
          else
            echo "Sparkle is not configured: creating a manual ZIP release only."
          fi

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/updates/$APP_NAME-$VERSION.zip" \
            --title "ArsWidget $VERSION" \
            --notes "$NOTES"

      - name: Сохранить номер версии и ленту обновлений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArsWidget.xcodeproj/project.pbxproj
          if [ -f "$RUNNER_TEMP/updates/appcast.xml" ]; then
            git add updater/appcast.xml
          fi
          git diff --cached --quiet || git commit -m "Release ArsWidget $VERSION"
          git push
